<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attaque des Maths" />
    <meta name="description" content="Un jeu de plateforme pour apprendre le calcul en s'amusant (7-10 ans) — jouable au clavier ou au doigt." />
    <title>Ben &amp; Alice : l'Attaque des Maths</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        background-color: #0f172a;
        font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', 'Chalkboard SE', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The whole visible screen (dvh: without the mobile address bar), minus notches. */
      #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        outline: none;
      }
      canvas {
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 4px rgba(255, 255, 255, 0.12);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container" tabindex="-1"></div>
    <!-- On-screen gamepad (touch screens, during a game, when chosen in the menu) -->
    <div id="touch-controls" aria-hidden="true" hidden></div>
    <!-- "Rotate your phone" hint (phones in portrait), texts from src/i18n/i18n.js -->
    <div id="rotate-hint" role="dialog" aria-labelledby="rotate-title" hidden>
      <div class="rotate-phone" aria-hidden="true">📱</div>
      <p id="rotate-title"></p>
      <button id="rotate-dismiss" type="button"></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
